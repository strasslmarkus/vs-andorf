  function renderTemplateEditor(){
    var ed = state.templateEditor;
    if(!ed) return "";
    // Nur benannte Leistungsarten zählen für die 100%-Prüfung, da unbenannte beim Speichern
    // ohnehin verworfen werden (siehe saveTplBtn) — die angezeigte Summe muss exakt der
    // tatsächlich gespeicherten entsprechen, sonst wirkt die Sperre des Speichern-Buttons
    // widersprüchlich.
    var sum = ed.categories.filter(function(c){ return c.name && c.name.trim(); }).reduce(function(a,c){return a+(Number(c.weight)||0);},0);
    var html = '<div class="card card-pad tpl-editor" style="margin-top:14px;">';
    html += '<div class="section-title">'+(ed.id?'Vorlage bearbeiten':'Neue Vorlage')+'</div>';
    html += '<div class="field" style="max-width:280px;"><label>Name der Vorlage</label><input type="text" id="tplNameInput" value="'+esc(ed.name)+'" placeholder="z. B. Mathematik"></div>';
    html += '<table class="entries-table" style="margin-top:14px;"><thead><tr><th>Leistungsart</th><th style="width:100px;">Gewicht %</th><th style="width:190px;">Beurteilungskriterium</th><th></th></tr></thead><tbody>';
    ed.categories.forEach(function(cat, i){
      html += '<tr>'
        + '<td><input type="text" class="tplCatName" list="leistungsartOptions" data-idx="'+i+'" value="'+esc(cat.name)+'" placeholder="z. B. Mitarbeit"></td>'
        + '<td><input type="number" class="tplCatWeight" id="tplCatWeight-'+i+'" data-idx="'+i+'" value="'+cat.weight+'" min="0" max="100"></td>'
        + '<td><select class="tplCatCriterion" data-idx="'+i+'">'
            + '<option value="punkte"'+(cat.criterion==="punkte"?' selected':'')+'>Punktekatalog</option>'
            + '<option value="fehler"'+(cat.criterion==="fehler"?' selected':'')+'>Fehlerkatalog</option>'
            + '<option value="symbol"'+(cat.criterion==="symbol"?' selected':'')+'>Symbolkatalog</option>'
            + '</select></td>'
        + '<td><button class="icon-btn" data-action="remove-tpl-cat" data-idx="'+i+'" title="Entfernen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    html += '<datalist id="leistungsartOptions">'+state.settings.gradeTypeCatalog.map(function(s){ return '<option value="'+esc(s)+'">'; }).join("")+'</datalist>';
    html += '<button type="button" class="btn sm ghost" id="addTplCatBtn" style="margin-top:10px;">+ Leistungsart hinzufügen</button>';
    html += '<div class="row between" style="margin-top:14px;">'
      + '<div class="subnote '+(sum===100?'ok':'warn')+'">Summe der Gewichte: '+sum+'%'+(sum!==100?' — muss 100% ergeben':'')+'</div>'
      + '<div class="row"><button class="btn primary sm" id="saveTplBtn" '+(sum===100?'':'disabled')+'>Vorlage speichern</button><button class="btn ghost sm" id="cancelTplBtn" type="button">Abbrechen</button></div>'
      + '</div>';

    html += '<div class="tpl-reference-block"><details><summary>Punktekatalog testen</summary><div class="body row">'
      + '<div class="field" style="width:140px;"><label>Gesamtpunkte</label><input type="number" id="punkteCalcMax" min="10" max="119" value="20"></div>'
      + '<div class="field" style="width:140px;"><label>Erreichte Punkte</label><input type="number" id="punkteCalcVal" min="0" value="16"></div>'
      + '<div class="field"><label>Ergebnis</label><span id="punkteCalcResult" class="gpill"></span></div>'
      + '</div><div id="punkteCalcError" class="subnote warn" style="display:none;"></div><p class="subnote">Skala nach hinterlegtem Punktekatalog (gültig für 10–119 Gesamtpunkte).</p></details></div>';

    var ft = fehlerThresholds();
    html += '<div class="tpl-reference-block"><details><summary>Fehlerkatalog-Skala</summary><div class="body"><table class="entries-table" style="max-width:300px;"><tbody>'
      + '<tr><td>0–'+ft[0]+' Fehler</td><td class="num">Note 1</td></tr>'
      + '<tr><td>'+(ft[0]+1)+'–'+ft[1]+' Fehler</td><td class="num">Note 2</td></tr>'
      + '<tr><td>'+(ft[1]+1)+'–'+ft[2]+' Fehler</td><td class="num">Note 3</td></tr>'
      + '<tr><td>'+(ft[2]+1)+'–'+ft[3]+' Fehler</td><td class="num">Note 4</td></tr>'
      + '<tr><td>&gt;'+ft[3]+' Fehler</td><td class="num">Note 5</td></tr>'
      + '</tbody></table></div><div class="subnote">Schwellwerte global in Einstellungen → Beurteilungskriterien änderbar.</div></details></div>';

    html += '<div class="tpl-reference-block"><details><summary>Symbolkatalog</summary><div class="body"><table class="entries-table" style="max-width:380px;"><tbody>'
      + symbolOptionsLive().map(function(o){ return '<tr><td class="mono">'+esc(o.sym)+'</td><td>'+esc(o.label)+'</td><td class="num">'+(o.grade?('Note '+o.grade):'keine Note')+'</td></tr>'; }).join("")
      + '</tbody></table></div><div class="subnote">Notenzuordnung global in Einstellungen → Beurteilungskriterien änderbar.</div></details></div>';

    html += '</div>';
    return html;
  }

  // Bearbeiten-Zeile für einen bestehenden Eintrag in "Letzte Einträge" – ersetzt die normale
  // Zeile durch Dropdownfelder + das passende Eingabefeld je Beurteilungskriterium.
  function renderEditGradeRow(subs){
    var eg = state.editGradeForm;
    var egOpts = subjectCriterionOptions(eg.subject);
    if(!egOpts.length) egOpts = [{name:"Leistung", criterion:"symbol"}];
    if(!eg.leistungsart || !egOpts.some(function(o){return o.name===eg.leistungsart;})) eg.leistungsart = egOpts[0].name;
    var egCriterion = criterionForLeistungsart(eg.subject, eg.leistungsart);
    var egGrade = egCriterion==="punkte" ? ((eg.punkteVal===null||eg.punkteVal===undefined||eg.punkteVal==="") ? null : gradeFromPunkte(eg.punkteMax, eg.punkteVal))
      : egCriterion==="fehler" ? ((eg.fehlerCount===null||eg.fehlerCount===undefined||eg.fehlerCount==="") ? null : gradeFromFehler(eg.fehlerCount))
      : (eg.symbol ? symbolToGrade(eg.symbol) : null);
    // "∀" (entschuldigt/nicht bewertbar) liefert absichtlich keine Note (egGrade bleibt null),
    // ist aber trotzdem eine gültige, speicherbare Auswahl.
    var egCanSave = egCriterion==="symbol" ? !!eg.symbol : !!egGrade;

    var html = '<tr><td colspan="7"><div class="stack" style="gap:10px; padding:8px 0;">';
    html += '<div class="row" style="flex-wrap:wrap;">';
    html += '<div class="field" style="width:200px;"><label>Schüler:in</label><select id="egStudent">'+state.students.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===eg.studentId?' selected':'')+'>'+esc(s.name)+'</option>';}).join("")+'</select></div>';
    html += '<div class="field" style="width:200px;"><label>Fach</label><select id="egSubject">'+subs.map(function(s){return '<option value="'+esc(s)+'"'+(s===eg.subject?' selected':'')+'>'+esc(s)+'</option>';}).join("")+'</select></div>';
    html += '<div class="field" style="width:200px;"><label>Leistungsart</label><select id="egLeistungsart">'+egOpts.map(function(o){return '<option value="'+esc(o.name)+'" data-criterion="'+esc(o.criterion)+'"'+(o.name===eg.leistungsart?' selected':'')+'>'+esc(o.name)+'</option>';}).join("")+'</select></div>';
    html += '<div class="field" style="width:150px;"><label>Datum</label><input type="date" id="egDate" value="'+esc(eg.date)+'"></div>';
    html += '<div class="field ac-wrap" style="flex:1; min-width:180px;"><label>Name der Leistung</label><input type="text" id="egNote" autocomplete="off" value="'+esc(eg.note)+'" placeholder="z. B. 2. Test" required>'
      + '<div class="ac-list" id="egNoteList" hidden>'+pastLeistungsNamen(eg.subject, eg.leistungsart).map(function(e){return '<div class="ac-item" data-name="'+esc(e.name)+'"><b>'+esc(e.name)+'</b>'+(e.date?' <span class="ac-date">· '+esc(fmtDate(e.date))+'</span>':'')+'</div>';}).join("")+'</div>'
      + '</div>';
    html += '</div>';

    html += (egCriterion==="punkte"
        ? ('<div class="row" style="align-items:flex-end;">'
          + '<div class="field" style="width:140px;"><label>Gesamtpunkte</label><input type="number" id="egPunkteMax" min="10" max="119" value="'+esc(eg.punkteMax)+'"></div>'
          + '<div class="field" style="width:140px;"><label>Erreichte Punkte</label><input type="number" id="egPunkteVal" min="0" value="'+(eg.punkteVal===null||eg.punkteVal===undefined?'':eg.punkteVal)+'"></div>'
          + '<div class="field"><label>Ergebnis</label>'+resultPill(egGrade)+'</div>'
          + '</div>')
        : egCriterion==="fehler"
        ? ('<div class="row" style="align-items:flex-end;">'
          + '<div class="field" style="width:160px;"><label>Anzahl Fehler</label><input type="number" id="egFehlerCount" min="0" value="'+(eg.fehlerCount===null||eg.fehlerCount===undefined?'':eg.fehlerCount)+'"></div>'
          + '<div class="field"><label>Ergebnis</label>'+resultPill(egGrade)+'</div>'
          + '</div>')
        : ('<div class="row" style="align-items:center;">'
          + '<div class="grade-btn-row">'
          + symbolOptionsLive().map(function(o){
              var active = eg.symbol===o.sym;
              var style = active ? (o.grade ? ('background:'+GRADE_COLOR_HEX[o.grade]+';border-color:'+GRADE_COLOR_HEX[o.grade]+';color:'+GRADE_TEXT_ON[o.grade]+';') : 'background:var(--ink-muted);border-color:var(--ink-muted);color:#fff;') : '';
              return '<button type="button" class="grade-btn'+(active?' picked':'')+'" style="'+style+'" data-action="pick-symbol-edit" data-sym="'+esc(o.sym)+'" title="'+esc(o.label)+'">'+esc(o.sym)+'</button>';
            }).join("")
          + '</div>'
          + '<div class="field" style="margin-left:14px;"><label>Ergebnis</label>'+resultPill(egGrade)+'</div>'
          + '</div>'));

    html += '<div class="row" style="justify-content:flex-end;">'
      + '<button class="btn ghost sm" id="cancelEditGradeBtn" type="button">Abbrechen</button>'
      + '<button class="btn primary sm" id="saveEditGradeBtn" '+((egCanSave && eg.note && eg.note.trim())?'':'disabled')+'>Speichern</button>'
      + '</div>';
    html += '</div></td></tr>';
    return html;
  }

  /* ============================= view: Leistungseingabe ============================= */
  function viewLeistungseingabe(){
    var c = activeClass();
    if(!c){
      return '<div class="empty"><h3>Keine Klasse ausgewählt</h3><p>Wähle links eine Klasse oder lege in der Klassenkonfiguration eine neue an.</p><button class="btn primary" data-action="goto" data-view="klassenkonfiguration">Zur Klassenkonfiguration</button></div>';
    }
    var subs = classSubjects().map(function(s){ return s.name; });
    if(!subs.length){
      return '<div class="empty"><h3>Keine Fächer hinterlegt</h3><p>Füge dieser Klasse zuerst Fächer hinzu.</p><button class="btn primary" data-action="goto" data-view="klassenkonfiguration">Zur Klassenkonfiguration</button></div>';
    }
    if(!state.students.length){
      return '<div class="empty"><h3>Keine Schüler:innen in dieser Klasse</h3><p>Trage zuerst Schüler:innen in der Klassenkonfiguration ein.</p><button class="btn primary" data-action="goto" data-view="klassenkonfiguration">Zur Klassenkonfiguration</button></div>';
    }
    var ef = state.entryForm;
    // Fach und Leistungsart werden bewusst NICHT mehr automatisch mit dem ersten Eintrag der
    // Liste vorbelegt – die Dropdowns sollen nach einem Reset (Menü öffnen, Box aufklappen,
    // "Neuer Eintrag") wirklich leer erscheinen, bis die Lehrkraft aktiv eine Auswahl trifft.
    // Passt eine frühere Auswahl nicht mehr zu den aktuellen Leistungsarten (z.B. nach
    // Fachwechsel), wird nur diese eine unpassende Auswahl verworfen statt automatisch ersetzt.
    var efOpts = subjectCriterionOptions(ef.subject);
    if(!efOpts.length) efOpts = [{name:"Leistung", criterion:"symbol"}];
    if(ef.leistungsart && !efOpts.some(function(o){return o.name===ef.leistungsart;})) ef.leistungsart = null;
    var efCriterion = criterionForLeistungsart(ef.subject, ef.leistungsart);
    // Beim Auswählen eines bereits verwendeten Namens ("alte Leistung") die damals
    // eingetragenen Werte je Schüler:in ins Formular laden, damit sie verändert werden können.
    if(ef._pendingMatchCheck){
      ef._pendingMatchCheck = false;
      var efMatches = findExistingGradesByNote(ef.subject, ef.leistungsart, ef.note);
      if(efMatches.length){
        ef.date = efMatches[0].date || ef.date;
        var newPicks = {};
        efMatches.forEach(function(g){
          var parsed = parseDetailForCriterion(g.detail, efCriterion);
          // Ein gespeicherter Eintrag kann eine studentId tragen, die es unter den aktuellen
          // Schüler:innen nicht mehr gibt (z. B. weil die Person entfernt und später mit neuer
          // id wieder hinzugefügt wurde – bestehende Noteneinträge bleiben dabei absichtlich
          // erhalten). In dem Fall über den Namen auf die aktuelle id auflösen, damit der
          // Eintrag in der Mehrfachnoten-Tabelle als "bereits ausgewählt" erscheint und beim
          // Speichern aktualisiert statt übersehen wird.
          var sid = g.studentId;
          if(!state.students.some(function(s){return s.id===sid;})){
            var byName = state.students.find(function(s){return s.name===g.studentName;});
            if(byName) sid = byName.id; else return;
          }
          if(efCriterion==="punkte"){
            if(parsed.punkteMax!==undefined) ef.punkteMax = parsed.punkteMax;
            if(parsed.punkteVal!==undefined) newPicks[sid] = parsed.punkteVal;
          } else if(efCriterion==="fehler"){
            if(parsed.fehlerCount!==undefined) newPicks[sid] = parsed.fehlerCount;
          } else if(parsed.symbol!==undefined){
            newPicks[sid] = parsed.symbol;
          }
        });
        ef.picks = newPicks;
      } else {
        ef.picks = {};
      }
    }

    var sf = state.singleEntryForm;
    if(!sf.student) sf.student = state.students[0].id;
    // Wie bei ef: Fach und Leistungsart bleiben nach einem Reset bewusst leer statt automatisch
    // vorbelegt zu werden.
    var sfOpts = subjectCriterionOptions(sf.subject);
    if(!sfOpts.length) sfOpts = [{name:"Leistung", criterion:"symbol"}];
    if(sf.leistungsart && !sfOpts.some(function(o){return o.name===sf.leistungsart;})) sf.leistungsart = null;
    var sfCriterion = criterionForLeistungsart(sf.subject, sf.leistungsart);
    // Beim Auswählen eines bereits verwendeten Namens ("alte Leistung") den damals
    // eingetragenen Wert ins Formular laden, damit er verändert werden kann.
    if(sf._pendingMatchCheck){
      sf._pendingMatchCheck = false;
      var sfMatch = findExistingGrade(sf.student, sf.subject, sf.leistungsart, sf.note);
      if(sfMatch){
        var sfParsed = parseDetailForCriterion(sfMatch.detail, sfCriterion);
        sf.date = sfMatch.date || sf.date;
        if(sfParsed.punkteMax!==undefined) sf.punkteMax = sfParsed.punkteMax;
        sf.punkteVal = sfParsed.punkteVal!==undefined ? sfParsed.punkteVal : null;
        sf.fehlerCount = sfParsed.fehlerCount!==undefined ? sfParsed.fehlerCount : null;
        sf.symbol = sfParsed.symbol!==undefined ? sfParsed.symbol : null;
      } else {
        // Diese:r Schüler:in hat noch keine eigene Note zu diesem Namen – trotzdem den
        // Kontext (Datum, bei Punkte-Leistungsarten auch die Gesamtpunkte) von anderen
        // Schüler:innen übernehmen, bei denen diese Leistung (z.B. über "Mehrfachnoten")
        // bereits erfasst wurde. Sonst wirkt die Auswahl eines bestehenden Namens so, als
        // würde die zuvor eingegebene Leistung gar nicht angezeigt.
        var sfGroupMatches = findExistingGradesByNote(sf.subject, sf.leistungsart, sf.note);
        if(sfGroupMatches.length){
          sf.date = sfGroupMatches[0].date || sf.date;
          if(sfCriterion==="punkte"){
            var sfGroupParsed = parseDetailForCriterion(sfGroupMatches[0].detail, sfCriterion);
            if(sfGroupParsed.punkteMax!==undefined) sf.punkteMax = sfGroupParsed.punkteMax;
          }
        }
        sf.punkteVal = null; sf.fehlerCount = null; sf.symbol = null;
      }
    }
    var sfGrade = sfCriterion==="punkte" ? ((sf.punkteVal===null||sf.punkteVal===undefined||sf.punkteVal==="") ? null : gradeFromPunkte(sf.punkteMax, sf.punkteVal))
      : sfCriterion==="fehler" ? ((sf.fehlerCount===null||sf.fehlerCount===undefined||sf.fehlerCount==="") ? null : gradeFromFehler(sf.fehlerCount))
      : (sf.symbol ? symbolToGrade(sf.symbol) : null);
    // "∀" (entschuldigt/nicht bewertbar) liefert absichtlich keine Note (sfGrade bleibt null),
    // ist aber trotzdem eine gültige, speicherbare Auswahl – daher eigene Prüfung fürs Freischalten
    // des Speichern-Buttons statt sich allein auf sfGrade zu verlassen.
    var sfCanSave = sfCriterion==="symbol" ? !!sf.symbol : !!sfGrade;
    var sfMaxInvalid = sfCriterion==="punkte" && !(Number(sf.punkteMax)>=10 && Number(sf.punkteMax)<=119);
    var sfExistingMatch = findExistingGrade(sf.student, sf.subject, sf.leistungsart, sf.note);
    var efExistingMatches = findExistingGradesByNote(ef.subject, ef.leistungsart, ef.note);
    var sfNameOk = !!(sf.note && sf.note.trim());
    var efNameOk = !!(ef.note && ef.note.trim());
    // Solange Fach oder Leistungsart nicht ausgewählt sind (z.B. direkt nach einem Reset),
    // ist keine Note eingabebereit und "speichern" bleibt gesperrt.
    var sfReady = !!(sf.subject && sf.leistungsart);
    var efReady = !!(ef.subject && ef.leistungsart);
    var sfOtherMatches = (!sfExistingMatch && sfNameOk) ? findExistingGradesByNote(sf.subject, sf.leistungsart, sf.note).filter(function(g){return g.studentId!==sf.student;}) : [];

    var html = '<div class="card card-pad">'
      + collapseHead('singleEntry', 'Einzelnote eintragen')
      + (isCollapsed('singleEntry') ? '' : ('<div class="collapse-body">'
      + '<div class="row" style="margin-bottom:16px;">'
      + '<div class="field" style="width:220px;"><label>Schüler:in</label><select id="sfStudent">'+state.students.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===sf.student?' selected':'')+'>'+esc(s.name)+'</option>';}).join("")+'</select></div>'
      + '<div class="field" style="width:220px;"><label>Fach</label><select id="sfSubject"><option value=""'+(sf.subject?'':' selected')+' disabled hidden>Bitte wählen</option>'+subs.map(function(s){return '<option value="'+esc(s)+'"'+(s===sf.subject?' selected':'')+'>'+esc(s)+'</option>';}).join("")+'</select></div>'
      + '<div class="field" style="width:220px;"><label>Leistungsart</label><select id="sfLeistungsart"><option value=""'+(sf.leistungsart?'':' selected')+' disabled hidden>Bitte wählen</option>'+sfOpts.map(function(o){return '<option value="'+esc(o.name)+'" data-criterion="'+esc(o.criterion)+'"'+(o.name===sf.leistungsart?' selected':'')+'>'+esc(o.name)+'</option>';}).join("")+'</select></div>'
      + '<div class="field" style="width:160px;"><label>Datum</label><input type="date" id="sfDate" value="'+esc(sf.date)+'"></div>'
      + '<div class="field ac-wrap" style="flex:1; min-width:200px;"><label>Name der Leistung</label><input type="text" id="sfNote" autocomplete="off" value="'+esc(sf.note)+'" placeholder="z. B. 2. Test" required>'
      + '<div class="ac-list" id="sfNoteList" hidden>'+pastLeistungsNamen(sf.subject, sf.leistungsart).map(function(e){return '<div class="ac-item" data-name="'+esc(e.name)+'"><b>'+esc(e.name)+'</b>'+(e.date?' <span class="ac-date">· '+esc(fmtDate(e.date))+'</span>':'')+'</div>';}).join("")+'</div>'
      + '</div>'
      + '</div>'
      + (!sfReady ? '<div class="subnote warn" style="margin-bottom:10px;">Bitte zuerst Fach und Leistungsart auswählen.</div>'
          : !sfNameOk ? '<div class="subnote warn" style="margin-bottom:10px;">Bitte zuerst den Namen der Leistung eingeben, bevor eine Note vergeben wird.</div>' : '')
      + (sfCriterion==="punkte"
          ? ('<div class="row" style="align-items:flex-end; margin-bottom:6px;">'
            + '<div class="field" style="width:140px;"><label>Gesamtpunkte</label><input type="number" id="sfPunkteMax" min="10" max="119" value="'+esc(sf.punkteMax)+'"></div>'
            + '<div class="field" style="width:140px;"><label>Erreichte Punkte</label><input type="number" id="sfPunkteVal" class="'+((sfNameOk && sfReady)?'':'grade-locked')+'" min="0" value="'+(sf.punkteVal===null||sf.punkteVal===undefined?'':sf.punkteVal)+'"></div>'
            + '<div class="field"><label>Ergebnis</label>'+resultPill(sfGrade)+'</div>'
            + '</div>'
            + (sfMaxInvalid ? '<div class="subnote warn" style="margin-bottom:10px;">Gesamtpunkte müssen zwischen 10 und 119 liegen.</div>' : ''))
          : sfCriterion==="fehler"
          ? ('<div class="row" style="align-items:flex-end; margin-bottom:6px;">'
            + '<div class="field" style="width:160px;"><label>Anzahl Fehler</label><input type="number" id="sfFehlerCount" class="'+((sfNameOk && sfReady)?'':'grade-locked')+'" min="0" value="'+(sf.fehlerCount===null||sf.fehlerCount===undefined?'':sf.fehlerCount)+'"></div>'
            + '<div class="field"><label>Ergebnis</label>'+resultPill(sfGrade)+'</div>'
            + '</div>')
          : ('<div class="row" style="align-items:center; margin-bottom:6px;">'
            + '<div class="grade-btn-row">'
            + symbolOptionsLive().map(function(o){
                var active = sf.symbol===o.sym;
                var style = active ? (o.grade ? ('background:'+GRADE_COLOR_HEX[o.grade]+';border-color:'+GRADE_COLOR_HEX[o.grade]+';color:'+GRADE_TEXT_ON[o.grade]+';') : 'background:var(--ink-muted);border-color:var(--ink-muted);color:#fff;') : '';
                return '<button type="button" class="grade-btn'+(active?' picked':'')+((sfNameOk && sfReady)?'':' grade-locked')+'" style="'+style+'" data-action="pick-symbol-single" data-sym="'+esc(o.sym)+'" title="'+esc(o.label)+'">'+esc(o.sym)+'</button>';
              }).join("")
            + '</div>'
            + '<div class="field" style="margin-left:14px;"><label>Ergebnis</label>'+resultPill(sfGrade)+'</div>'
            + '</div>'))
      + '<div class="row between" style="justify-content:flex-end; gap:14px;">'
      + (sfExistingMatch ? '<div class="subnote">Bestehender Eintrag vom '+fmtDate(sfExistingMatch.date)+' wird aktualisiert.</div>'
          : sfOtherMatches.length ? '<div class="subnote">Diese Leistung wurde bereits bei '+sfOtherMatches.length+' anderen Schüler:in(nen) erfasst – hier wird ein neuer Eintrag angelegt.</div>' : '')
      + (sfExistingMatch ? '<button class="btn ghost" id="newSingleEntryBtn" type="button">Neuer Eintrag</button>' : '')
      + '<button class="btn primary" id="saveSingleEntryBtn" '+((sfCanSave && sfNameOk && sfReady)?'':'disabled')+'>'+(sfExistingMatch ? 'Eintrag aktualisieren' : 'Eintrag speichern')+'</button>'
      + '</div>'
      + '</div>'))
      + '</div>';

    html += '<div class="card card-pad" style="margin-top:20px;">'
      + collapseHead('multiEntry', 'Mehrfachnoten eintragen')
      + (isCollapsed('multiEntry') ? '' : ('<div class="collapse-body">'
      + '<div class="row" style="margin-bottom:16px;">'
      + '<div class="field" style="width:220px;"><label>Fach</label><select id="efSubject"><option value=""'+(ef.subject?'':' selected')+' disabled hidden>Bitte wählen</option>'+subs.map(function(s){return '<option value="'+esc(s)+'"'+(s===ef.subject?' selected':'')+'>'+esc(s)+'</option>';}).join("")+'</select></div>'
      + '<div class="field" style="width:220px;"><label>Leistungsart</label><select id="efLeistungsart"><option value=""'+(ef.leistungsart?'':' selected')+' disabled hidden>Bitte wählen</option>'+efOpts.map(function(o){return '<option value="'+esc(o.name)+'" data-criterion="'+esc(o.criterion)+'"'+(o.name===ef.leistungsart?' selected':'')+'>'+esc(o.name)+'</option>';}).join("")+'</select></div>'
      + (efCriterion==="punkte" ? '<div class="field" style="width:140px;"><label>Gesamtpunkte</label><input type="number" id="efPunkteMax" min="10" max="119" value="'+esc(ef.punkteMax)+'"></div>' : '')
      + '<div class="field" style="width:160px;"><label>Datum</label><input type="date" id="efDate" value="'+esc(ef.date)+'"></div>'
      + '<div class="field ac-wrap" style="flex:1; min-width:200px;"><label>Name der Leistung</label><input type="text" id="efNote" autocomplete="off" value="'+esc(ef.note)+'" placeholder="z. B. 2. Test" required>'
      + '<div class="ac-list" id="efNoteList" hidden>'+pastLeistungsNamen(ef.subject, ef.leistungsart).map(function(e){return '<div class="ac-item" data-name="'+esc(e.name)+'"><b>'+esc(e.name)+'</b>'+(e.date?' <span class="ac-date">· '+esc(fmtDate(e.date))+'</span>':'')+'</div>';}).join("")+'</div>'
      + '</div>'
      + '</div>'
      + (!efReady ? '<div class="subnote warn" style="margin-bottom:10px;">Bitte zuerst Fach und Leistungsart auswählen.</div>'
          : !efNameOk ? '<div class="subnote warn" style="margin-bottom:10px;">Bitte zuerst den Namen der Leistung eingeben, bevor Noten vergeben werden.</div>' : '')
      + '<table class="entries-table" style="margin-bottom:12px;"><thead><tr><th>Schüler:in</th>'
        + (efCriterion==="punkte" ? '<th style="width:160px;">Erreichte Punkte</th>' : efCriterion==="fehler" ? '<th style="width:160px;">Anzahl Fehler</th>' : '<th style="width:260px;">Symbol</th>')
        + '<th style="width:90px;" class="num">Note</th></tr></thead><tbody>'
      + state.students.map(function(s){
          var raw = ef.picks[s.id];
          var grade;
          var inputCell;
          if(efCriterion==="punkte"){
            grade = (raw===undefined||raw===null||raw==="") ? null : gradeFromPunkte(ef.punkteMax, raw);
            inputCell = '<input type="number" class="efPunkteInput'+((efNameOk && efReady)?'':' grade-locked')+'" id="efPunkteInput-'+esc(s.id)+'" data-student="'+esc(s.id)+'" min="0" style="width:110px;" value="'+((raw===undefined||raw===null)?'':raw)+'">';
          } else if(efCriterion==="fehler"){
            grade = (raw===undefined||raw===null||raw==="") ? null : gradeFromFehler(raw);
            inputCell = '<input type="number" class="efFehlerInput'+((efNameOk && efReady)?'':' grade-locked')+'" id="efFehlerInput-'+esc(s.id)+'" data-student="'+esc(s.id)+'" min="0" style="width:110px;" value="'+((raw===undefined||raw===null)?'':raw)+'">';
          } else {
            grade = raw ? symbolToGrade(raw) : null;
            inputCell = '<div class="grade-btn-row">' + symbolOptionsLive().map(function(o){
              var active = raw===o.sym;
              var style = active ? (o.grade ? ('background:'+GRADE_COLOR_HEX[o.grade]+';border-color:'+GRADE_COLOR_HEX[o.grade]+';color:'+GRADE_TEXT_ON[o.grade]+';') : 'background:var(--ink-muted);border-color:var(--ink-muted);color:#fff;') : '';
              return '<button type="button" class="grade-btn'+(active?' picked':'')+((efNameOk && efReady)?'':' grade-locked')+'" style="'+style+'" data-action="pick-symbol" data-student="'+esc(s.id)+'" data-sym="'+esc(o.sym)+'" title="'+esc(o.label)+'">'+esc(o.sym)+'</button>';
            }).join("") + '</div>';
          }
          return '<tr><td>'+esc(s.name)+'</td><td>'+inputCell+'</td><td class="num">'+resultPill(grade)+'</td></tr>';
        }).join("")
      + '</tbody></table>'
      + (function(){
          var pickedCount = state.students.filter(function(s){
            var raw = ef.picks[s.id];
            if(efCriterion==="punkte") return raw!==undefined && raw!==null && raw!=="" && !!gradeFromPunkte(ef.punkteMax, raw);
            if(efCriterion==="fehler") return raw!==undefined && raw!==null && raw!=="" && !!gradeFromFehler(raw);
            return !!raw;
          }).length;
          var subnoteTxt = pickedCount+' von '+state.students.length+' Einträge ausgewählt'+(efExistingMatches.length ? ' · '+efExistingMatches.length+' bestehende Einträge werden aktualisiert' : '');
          // margin-left:auto statt justify-content:space-between auf der äußeren Zeile:
          // so bleibt die Buttongruppe auch dann rechtsbündig, wenn sie (weil der Text links
          // oder die Buttons rechts länger werden) in eine eigene Zeile umbricht – bei
          // space-between würde eine einzelne umgebrochene Zeile sonst nach links springen.
          return '<div class="row"><div class="subnote">'+subnoteTxt+'</div><div class="row" style="gap:14px; margin-left:auto;">'
            + (efExistingMatches.length ? '<button class="btn ghost" id="newMultiEntryBtn" type="button">Neuer Eintrag</button>' : '')
            + '<button class="btn primary" id="saveEntriesBtn" '+((pickedCount && efNameOk && efReady)?'':'disabled')+'>'+(efExistingMatches.length ? 'Einträge aktualisieren' : 'Einträge speichern')+'</button>'
            + '</div></div>';
        })()
      + '</div>'))
      + '</div>';

    var recent = state.grades.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0); }).slice(0,30);
    html += '<div class="card card-pad" style="margin-top:20px;">'
      + collapseHead('recentEntries', 'Letzte Einträge')
      + (isCollapsed('recentEntries') ? '' : ('<div class="collapse-body">'
        + (recent.length
            ? ('<div style="overflow-x:auto;"><table class="entries-table"><thead><tr><th>Datum</th><th>Schüler:in</th><th>Fach</th><th>Art</th><th>Notiz</th><th class="num">Note</th><th></th></tr></thead><tbody>'
              + recent.map(function(g){
                  if(g.id===state.editingGradeId) return renderEditGradeRow(subs);
                  return '<tr><td class="mono">'+fmtDate(g.date)+'</td><td>'+esc(g.studentName||"–")+'</td><td>'+esc(g.subject)+'</td><td>'+esc(g.type)+(g.detail?('<div class="subnote">'+esc(g.detail)+'</div>'):'')+'</td><td style="color:var(--ink-muted);">'+esc(g.note||"")+'</td>'
                    + '<td class="num">'+resultPill(g.value)+'</td>'
                    + '<td><div class="row" style="gap:4px;">'
                    + '<button class="icon-btn" data-action="edit-grade" data-id="'+esc(g.id)+'" title="Bearbeiten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'
                    + '<button class="icon-btn" data-action="delete-grade" data-id="'+esc(g.id)+'" title="Löschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>'
                    + '</div></td></tr>';
                }).join("")
              + '</tbody></table></div>')
            : '<p style="color:var(--ink-muted); font-size:0.85rem;">Noch keine Einträge für diese Klasse.</p>')
        + '</div>'))
      + '</div>';
    return html;
  }

  /* ============================= view: Dashboard ============================= */
  function viewDashboard(){
    var c = activeClass();
    if(!c){
      return '<div class="empty"><h3>Keine Klasse ausgewählt</h3><p>Wähle links eine Klasse, um Auswertungen zu sehen.</p></div>';
    }
    var html = '<div class="segmented" style="margin-bottom:20px;">'
      + '<button class="'+(state.dashTab==="klasse"?"active":"")+'" data-action="dash-tab" data-tab="klasse">Klassenübersicht</button>'
      + '<button class="'+(state.dashTab==="schueler"?"active":"")+'" data-action="dash-tab" data-tab="schueler">Schüler:innen-Verlauf</button>'
      + '</div>';
    html += state.dashTab==="klasse" ? dashKlasse() : dashSchueler();
    return html;
  }

  function dashKlasse(){
    var grades = state.grades;
    var overall = overallAverage(grades);
    var subs = subjectAverages(state.activeClassId, grades);
    var withData = subs.filter(function(s){return s.count>0;});

    var html = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:22px;">';
    html += statTile("Schüler:innen", state.students.length, "");
    html += statTile("Einträge gesamt", grades.length, "");
    html += statTile("Klassendurchschnitt", overall!=null? round1(overall).toFixed(1):"–", overall!=null? GRADE_COLOR_HEX[bandFor(overall)]:null);
    html += '</div>';

    html += '<div class="card card-pad" style="margin-bottom:20px;">';
    html += '<div class="section-title">Notenschnitt je Fach</div>';
    if(!withData.length){
      html += '<p style="color:var(--ink-muted); font-size:0.85rem;">Noch keine Einträge vorhanden.</p>';
    } else {
      subs.forEach(function(s){
        if(s.count===0 || s.avg===null){
          html += '<div class="barrow"><div class="lbl">'+esc(s.subject)+'</div><div class="bartrack"></div><div class="val" style="color:var(--ink-muted);">–</div></div>';
          return;
        }
        var pct = Math.max(4, (5-s.avg)/4*100);
        var band = bandFor(s.avg);
        html += '<div class="barrow" data-tip="'+esc(s.subject+': Ø '+round1(s.avg).toFixed(1)+' ('+s.count+' Einträge)')+'">'
          + '<div class="lbl">'+esc(s.subject)+'</div>'
          + '<div class="bartrack"><div class="barfill" style="width:'+pct.toFixed(1)+'%; background:'+GRADE_COLOR_HEX[band]+';"></div></div>'
          + '<div class="val">'+round1(s.avg).toFixed(1)+'</div>'
          + '</div>';
      });
      html += '<div class="subnote">Balkenlänge = Notenschnitt (voller Balken = 1,0 „Sehr gut“).</div>';
    }
    html += '</div>';

    html += '<div class="card card-pad">';
    html += '<div class="section-title">Notenverteilung je Fach</div>';
    html += '<div class="legend">'+[1,2,3,4,5].map(function(g){ return '<span class="legend-item"><span class="legend-swatch" style="background:'+GRADE_COLOR_HEX[g]+';"></span>'+g+' '+GRADE_LABELS[g]+'</span>'; }).join("")+'</div>';
    if(!withData.length){
      html += '<p style="color:var(--ink-muted); font-size:0.85rem;">Noch keine Einträge vorhanden.</p>';
    } else {
      subs.forEach(function(s){
        if(s.count===0) return;
        var d = distribution(s.items);
        html += '<div class="barrow" style="grid-template-columns:160px 1fr 40px;">'
          + '<div class="lbl">'+esc(s.subject)+'</div>'
          + '<div class="diststack">' + [1,2,3,4,5].map(function(g){
              var w = d[g]/s.count*100;
              if(!w) return "";
              return '<div class="distseg" data-tip="'+esc(GRADE_LABELS[g]+': '+d[g]+' von '+s.count)+'" style="width:'+w+'%; background:'+GRADE_COLOR_HEX[g]+';"></div>';
            }).join("") + '</div>'
          + '<div class="val" style="font-size:0.76rem; color:var(--ink-muted);">n='+s.count+'</div>'
          + '</div>';
      });
    }
    html += '</div>';
    return html;
  }

  function statTile(label, value, color){
    return '<div class="card stat-tile"><div class="label">'+label+'</div><div class="value"'+(color?(' style="color:'+color+';"'):'')+'>'+value+'</div></div>';
  }

  function dashSchueler(){
    if(!state.students.length){
      return '<div class="empty"><h3>Keine Schüler:innen</h3><p>Trage zuerst Schüler:innen in der Klassenkonfiguration ein.</p></div>';
    }
    if(!state.trendStudentId) state.trendStudentId = state.students[0].id;
    var subs = classSubjects().map(function(s){ return s.name; });
    var studentGradesAll = state.grades.filter(function(g){return g.studentId===state.trendStudentId;});
    var availSubs = subs.filter(function(s){ return studentGradesAll.some(function(g){return g.subject===s;}); });
    if(!state.trendSubject || subs.indexOf(state.trendSubject)===-1) state.trendSubject = availSubs[0] || subs[0];

    var html = '<div class="row" style="margin-bottom:18px;">';
    html += '<div class="field" style="width:220px;"><label>Schüler:in</label><select id="trendStudent">'+state.students.map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===state.trendStudentId?' selected':'')+'>'+esc(s.name)+'</option>';}).join("")+'</select></div>';
    html += '<div class="field" style="width:220px;"><label>Fach</label><select id="trendSubject">'+subs.map(function(s){return '<option value="'+esc(s)+'"'+(s===state.trendSubject?' selected':'')+'>'+esc(s)+'</option>';}).join("")+'</select></div>';
    html += '</div>';

    var res = studentAverage(state.trendStudentId, state.trendSubject);
    var items = res.items;
    var gradedItems = items.filter(hasGrade);
    // Statt des einfachen (ungewichteten) Notenschnitts wird hier – wie schon in der
    // Notenkonferenz – die nach Fächergewichtsvorlage gewichtete aktuelle Note gezeigt: je
    // Leistungsart zuerst der Schnitt, dann mit deren Prozentgewicht gewichtet gemittelt.
    var trendSuggestion = subjectGradeSuggestion(state.trendStudentId, state.trendSubject);
    var html2 = '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:18px;">';
    html2 += statTile("Aktuelle Note", trendSuggestion.avg!=null? round1(trendSuggestion.avg).toFixed(1) : "–", trendSuggestion.avg!=null? GRADE_COLOR_HEX[bandFor(trendSuggestion.avg)] : null);
    html2 += statTile("Einträge", items.length, "");
    var trendHtml = "–", trendClass="flat";
    if(gradedItems.length>=2){
      var firstHalf = gradedItems.slice(0, Math.ceil(gradedItems.length/2));
      var secondHalf = gradedItems.slice(Math.ceil(gradedItems.length/2));
      var a1 = firstHalf.reduce(function(a,g){return a+g.value;},0)/firstHalf.length;
      var a2 = secondHalf.reduce(function(a,g){return a+g.value;},0)/secondHalf.length;
      var diff = a1-a2; // positive = improved (lower grade later = better)
      if(Math.abs(diff) < 0.15){ trendHtml = "stabil"; trendClass="flat"; }
      else if(diff>0){ trendHtml = "verbessert (−"+round1(diff).toFixed(1)+")"; trendClass="good"; }
      else { trendHtml = "verschlechtert (+"+round1(-diff).toFixed(1)+")"; trendClass="bad"; }
    }
    html2 += '<div class="card stat-tile"><div class="label">Tendenz</div><div class="value" style="font-size:1.1rem;"><span class="delta '+trendClass+'">'+trendHtml+'</span></div></div>';
    html2 += '</div>';

    html2 += '<div class="card card-pad" style="margin-bottom:20px;">';
    html2 += '<div class="section-title">Verlauf – '+esc(state.trendSubject||"")+'</div>';
    html2 += gradedItems.length ? lineChart(gradedItems) : '<p style="color:var(--ink-muted); font-size:0.85rem;">'+(items.length?'Keine benoteten Einträge in diesem Fach (nur entschuldigte/nicht bewertbare).':'Noch keine Einträge in diesem Fach.')+'</p>';
    html2 += '</div>';

    html2 += '<div class="card card-pad">';
    html2 += '<div class="section-title">Alle Fächer – '+esc(state.students.find(function(s){return s.id===state.trendStudentId;}).name)+'</div>';
    html2 += '<p class="subnote" style="margin-bottom:8px;">Auf ein Fach klicken, um die Leistungen je Leistungsart aufzuschlüsseln.</p>';
    html2 += '<table class="entries-table"><thead><tr><th style="width:24px;"></th><th>Fach</th><th class="num">Einträge</th><th class="num">Note</th></tr></thead><tbody>';
    subs.forEach(function(s){
      var r = studentAverage(state.trendStudentId, s);
      // Auch hier die gewichtete aktuelle Note statt des einfachen Notenschnitts (r.avg wird
      // weiterhin für die Anzahl der Einträge sowie die Aufschlüsselung nach Leistungsart
      // gebraucht).
      var suggestion = subjectGradeSuggestion(state.trendStudentId, s);
      var key = 'dashSubj:'+state.trendStudentId+':'+s;
      var open = !isCollapsed(key);
      html2 += '<tr class="subj-row" data-action="toggle-collapse" data-key="'+esc(key)+'" aria-expanded="'+open+'">'
        + '<td><svg class="chev'+(open?' open':'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></td>'
        + '<td>'+esc(s)+'</td>'
        + '<td class="num tabular">'+r.items.length+'</td>'
        + '<td class="num">'+(suggestion.avg!=null? '<span class="gpill" style="background:'+GRADE_COLOR_HEX[bandFor(suggestion.avg)]+';color:'+GRADE_TEXT_ON[bandFor(suggestion.avg)]+';">'+round1(suggestion.avg).toFixed(1)+'</span>' : '<span style="color:var(--ink-muted);">–</span>')+'</td>'
        + '</tr>';
      if(open){
        html2 += '<tr class="subj-detail-row"><td colspan="4" style="padding:0; border-bottom:1px solid var(--border);"><div class="subj-detail">'+subjectBreakdownHtml(r.items, state.trendStudentId, s)+'</div></td></tr>';
      }
    });
    html2 += '</tbody></table></div>';

    return html + html2;
  }

  function lineChart(items){
    var W=760,H=200,padL=40,padR=16,padT=16,padB=30;
    var innerW = W-padL-padR, innerH = H-padT-padB;
    var n = items.length;
    function x(i){ return padL + (n===1? innerW/2 : i/(n-1)*innerW); }
    function y(v){ return padT + (v-1)/4*innerH; } // 1 top .. 5 bottom
    var gridLines = "";
    for(var g=1; g<=5; g++){
      var yy=y(g);
      gridLines += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--border)" stroke-width="1"/>';
      gridLines += '<text x="'+(padL-10)+'" y="'+(yy+5)+'" text-anchor="end" font-size="14" font-weight="600" fill="var(--ink-2)" font-family="var(--font-mono)">'+g+'</text>';
    }
    var path = items.map(function(g,i){ return (i===0?"M":"L")+x(i).toFixed(1)+","+y(g.value).toFixed(1); }).join(" ");
    var dots = items.map(function(g,i){
      var cx=x(i).toFixed(1), cy=y(g.value).toFixed(1);
      var tipTxt = fmtDate(g.date)+" · "+g.type+" · Note "+g.value+(g.note?(" · "+g.note):"");
      return '<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="'+GRADE_COLOR_HEX[g.value]+'" stroke="var(--surface)" stroke-width="2" class="pt" data-tip="'+esc(tipTxt)+'" style="cursor:pointer;"/>';
    }).join("");
    var xlabels = items.map(function(g,i){
      if(n>1 && i%Math.ceil(n/6)!==0 && i!==n-1) return "";
      return '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-muted)">'+fmtDate(g.date).slice(0,5)+'</text>';
    }).join("");
    return '<div style="overflow-x:auto;"><svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" style="min-width:520px; max-width:'+W+'px;">'
      + gridLines
      + '<path d="'+path+'" fill="none" stroke="var(--forest)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
      + dots + xlabels
      + '</svg></div>';
  }

  /* ============================= view: Notenkonferenz ============================= */
  function viewNotenkonferenz(){
    var c = activeClass();
    if(!c){
      return '<div class="empty"><h3>Keine Klasse ausgewählt</h3><p>Wähle links eine Klasse, um die Notenkonferenz-Übersicht zu sehen.</p></div>';
    }
    if(!state.students.length){
      return '<div class="empty"><h3>Keine Schüler:innen in dieser Klasse</h3><p>Trage zuerst Schüler:innen in der Klassenkonfiguration ein.</p></div>';
    }
    var subs = classSubjects().map(function(s){ return s.name; });
    if(!subs.length){
      return '<div class="empty"><h3>Keine Fächer hinterlegt</h3><p>Füge dieser Klasse zuerst Fächer hinzu.</p></div>';
    }

    var html = '<div class="row between" style="margin-bottom:16px; align-items:flex-start; gap:16px;">'
      + '<p class="subnote" style="max-width:640px; margin:0;">Vorgeschlagene Zeugnisnoten je Fach, berechnet aus den bisherigen Einträgen und – sofern hinterlegt – den Gewichten der Fächergewichtsvorlage. Zur Durchsprache und Absicherung in der Notenkonferenz; die endgültige Note bleibt eine pädagogische Entscheidung.</p>'
      + '</div>';

    // "Noteneingabe je Fach" steht ganz oben, da hier die eigentliche Eingabe passiert: ein
    // Fach auswählen, Vorschlag einsehen, Note eintragen.
    if(!subs.some(function(s){ return s===state.notenkonferenzSubject; })) state.notenkonferenzSubject = subs[0];
    var selSubj = state.notenkonferenzSubject;
    html += '<div class="card card-pad">';
    html += '<div class="row between no-print" style="margin-bottom:12px; align-items:center;">';
    html += '<div class="section-title" style="margin:0;">Noteneingabe je Fach</div>';
    html += '<div class="field" style="min-width:220px;"><select id="notenkonferenzSubjectSelect">'
      + subs.map(function(s){ return '<option value="'+esc(s)+'"'+(s===selSubj?' selected':'')+'>'+esc(s)+'</option>'; }).join("")
      + '</select></div>';
    html += '</div>';
    html += '<table class="entries-table"><thead><tr><th>Schüler:in</th><th class="num">Vorschlag</th><th class="num">Note</th></tr></thead><tbody>';
    state.students.forEach(function(s){
      var r = subjectGradeSuggestion(s.id, selSubj);
      var finalVal = (state.finalGrades[s.id] || {})[selSubj];
      html += '<tr><td>'+esc(s.name)+'</td>' + zeugnisSuggestCellHtml(r) + zeugnisFinalInputHtml(s.id, selSubj, finalVal, r.avg) + '</tr>';
    });
    html += '</tbody></table>';
    html += '<div class="subnote" style="margin-top:10px;">Vorschlag: aus den bisherigen Einträgen berechneter Notenschnitt (2 Kommastellen; bei zugewiesener Fächergewichtsvorlage nach deren Prozentgewichten je Leistungsart, sonst als einfacher Schnitt). Note: die von der Lehrkraft für das Zeugnis festgelegte, verbindliche Note.</div>';
    html += '</div>';

    // "Alle Zeugnisnoten" – reiner Überblick über alle Fächer auf einen Blick (nur Anzeige,
    // eine Spalte je Fach); das Eintragen erfolgt ausschließlich oben in "Noteneingabe je Fach".
    html += '<div class="card card-pad" style="overflow-x:auto; margin-top:20px;">';
    html += '<div class="row between" style="margin-bottom:12px; align-items:center;">'
      + '<div class="section-title" style="margin:0;">Alle Zeugnisnoten – '+esc(c.name)+'</div>'
      + '<button class="btn sm" id="exportZeugnisPdfBtn">Als PDF exportieren</button>'
      + '</div>';
    html += '<table class="entries-table"><thead><tr><th>Schüler:in</th>'
      + subs.map(function(s){ return '<th class="num">'+esc(s)+'</th>'; }).join("")
      + '</tr></thead><tbody>';
    state.students.forEach(function(s){
      html += '<tr><td>'+esc(s.name)+'</td>' + subs.map(function(subj){
        var finalVal = (state.finalGrades[s.id] || {})[subj];
        return zeugnisDisplayCellHtml(finalVal);
      }).join("") + '</tr>';
    });
    html += '</tbody></table>';
    html += '</div>';

    // Vergleich erste vs. zweite Hälfte der bisherigen Einträge je Schüler:in+Fach, um auf
    // Verbesserungen/Verschlechterungen hinzuweisen, die in der Konferenz relevant sein könnten.
    var notable = [];
    state.students.forEach(function(s){
      subs.forEach(function(subj){
        var items = studentAverage(s.id, subj).items.filter(hasGrade);
        if(items.length < 4) return;
        var firstHalf = items.slice(0, Math.ceil(items.length/2));
        var secondHalf = items.slice(Math.ceil(items.length/2));
        var a1 = firstHalf.reduce(function(a,g){return a+g.value;},0)/firstHalf.length;
        var a2 = secondHalf.reduce(function(a,g){return a+g.value;},0)/secondHalf.length;
        var diff = a1-a2; // positiv = verbessert (niedrigerer Notenwert später = besser)
        if(Math.abs(diff) >= 0.75) notable.push({ student:s.name, subject:subj, diff:diff, improved: diff>0 });
      });
    });
    notable.sort(function(a,b){ return Math.abs(b.diff)-Math.abs(a.diff); });

    html += '<div class="card card-pad" style="margin-top:20px;">';
    html += '<div class="section-title">Auffällige Entwicklungen</div>';
    if(!notable.length){
      html += '<p style="color:var(--ink-muted); font-size:0.85rem;">Keine auffälligen Verbesserungen oder Verschlechterungen im bisherigen Verlauf.</p>';
    } else {
      html += notable.map(function(n){
        var cls = n.improved ? 'good' : 'bad';
        var txt = n.improved ? ('verbessert (−'+round1(Math.abs(n.diff)).toFixed(1)+')') : ('verschlechtert (+'+round1(Math.abs(n.diff)).toFixed(1)+')');
        return '<div class="row between" style="padding:7px 0; border-bottom:1px solid var(--border);">'
          + '<div>'+esc(n.student)+' · '+esc(n.subject)+'</div>'
          + '<div class="delta '+cls+'">'+txt+'</div>'
          + '</div>';
      }).join("");
    }
    html += '<div class="subnote" style="margin-top:8px;">Vergleich der ersten mit der zweiten Hälfte der bisherigen Einträge je Fach (ab 4 Einträgen, Abweichung ≥ 0,75 Notenpunkte).</div>';
    html += '</div>';

    return html;
  }

  /* ============================= view: Export ============================= */
  function viewExport(){
    var html = '<div class="card card-pad" style="max-width:640px;">';
    html += '<div class="section-title">Export</div>';
    html += '<div class="field" style="margin-bottom:18px;"><label>Klasse</label><select id="exportClass">';
    html += '<option value="__all__">Alle Klassen</option>';
    state.classes.forEach(function(c){ html += '<option value="'+esc(c.id)+'"'+(c.id===state.activeClassId?' selected':'')+'>'+esc(c.name)+'</option>'; });

  function csvEscape(v){
    v = v==null ? "" : String(v);
    if(/[;"\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function toCsv(rows){
    return "﻿" + rows.map(function(r){ return r.map(csvEscape).join(";"); }).join("\r\n");
  }
  function fetchClassBundle(classId){
    // returns {class, students, grades} synchronously from state when it's the active class;
    // for db mode + other class, do a one-off read.
    if(classId===state.activeClassId || !state.dbAvailable){
      var cls = state.classes.find(function(c){return c.id===classId;});
      return Promise.resolve({cls:cls, students:state.students, grades:state.grades});
    }
    var cls = state.classes.find(function(c){return c.id===classId;});
    return Promise.all([studentsRef(classId).get(), gradesRef(classId).get()]).then(function(r){
      return { cls:cls, students:snapToArr(r[0]), grades:snapToArr(r[1]) };
    });
  }
  function allBundles(selection){
    if(selection!=="__all__") return fetchClassBundle(selection).then(function(b){ return [b]; });
    return Promise.all(state.classes.map(function(c){ return fetchClassBundle(c.id); }));
  }
  // Wie fetchClassBundle, aber inklusive Zeugnisnoten (finalGrades) und aller für eine
  // vollständige Wiederherstellung nötigen Klassenfelder — Grundlage für die JSON-Sicherung
  // ("Alle Daten (Sicherung)"), z.B. vor einem Umzug auf eine eigene Firebase-Datenbank.
  function fetchClassBundleFull(classId){
    var cls = state.classes.find(function(c){return c.id===classId;});
    if(classId===state.activeClassId || !state.dbAvailable){
      return Promise.resolve({cls:cls, students:state.students, grades:state.grades, finalGrades:state.finalGrades});
    }
    return Promise.all([studentsRef(classId).get(), gradesRef(classId).get(), finalGradesRef(classId).get()]).then(function(r){
      var fg = {};
      r[2].docs.forEach(function(d){ fg[d.id] = d.data()||{}; });
      return { cls:cls, students:snapToArr(r[0]), grades:snapToArr(r[1]), finalGrades:fg };
    });
  }
  // Exportiert wirklich ALLE Klassen mit Schüler:innen, Noteneinträgen, Zeugnisnoten und den
  // globalen Einstellungen als eine einzige JSON-Datei — gedacht als vollständige Sicherung,
  // die z.B. beim Umzug auf eine eigene (Firebase-)Datenbank per "Daten importieren" wieder
  // eingespielt werden kann, ohne dass Noten manuell neu eingegeben werden müssen.
  function doExportAllJson(){
    Promise.all(state.classes.map(function(c){ return fetchClassBundleFull(c.id); })).then(function(bundles){
      var data = {
        exportedAt: new Date().toISOString(),
        exportedFrom: "Leistungskompass",
        settings: state.settings,
        classes: bundles.filter(function(b){ return b.cls; }).map(function(b){
          return {
            id: b.cls.id,
            name: b.cls.name,
            schoolYear: b.cls.schoolYear || "",
            subjects: b.cls.subjects || [],
            weightTemplates: b.cls.weightTemplates || [],
            students: b.students.map(function(s){ return {id:s.id, name:s.name}; }),
            grades: b.grades.map(function(g){
              return {id:g.id, studentId:g.studentId, studentName:g.studentName, subject:g.subject, type:g.type,
                date:g.date, note:g.note||"", value: g.value===undefined?null:g.value, detail:g.detail||"", createdAt:g.createdAt||null};
            }),
            finalGrades: b.finalGrades || {}
          };
        })
      };
      triggerDownload("Leistungskompass_Sicherung_"+(new Date().toISOString().slice(0,10))+".json", JSON.stringify(data, null, 2));
    });
  }

  // Spielt eine zuvor mit "Alle Daten (Sicherung)" exportierte JSON-Datei wieder ein: jede
  // enthaltene Klasse wird als NEUE Klasse angelegt (neue ID), Schüler-IDs werden dabei neu
  // vergeben und über idMap remappt, damit Noteneinträge und Zeugnisnoten korrekt verknüpft
  // bleiben. Bestehende Klassen werden nicht verändert oder überschrieben.
  function doImportAllJson(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var data;
      try { data = JSON.parse(e.target.result); }
      catch(err){ showNotice("Diese Datei ist kein gültiges JSON und konnte nicht gelesen werden."); return; }
      if(!data || !Array.isArray(data.classes) || !data.classes.length){
        showNotice("Diese Datei enthält keine erkennbaren Klassendaten (erwartet wird eine mit \"Alle Daten (Sicherung)\" exportierte Datei).");
        return;
      }
      showConfirm(
        data.classes.length+" Klasse(n) aus dieser Datei als NEUE Klasse(n) anlegen? Bereits vorhandene Klassen bleiben unverändert erhalten, es werden keine Daten überschrieben.",
        function(){ runImportAllJson(data); },
        { okLabel:"Importieren", danger:false }
      );
    };
    reader.onerror = function(){ showNotice("Datei konnte nicht gelesen werden."); };
    reader.readAsText(file);
  }
  function runImportAllJson(data){
    if(data.settings && typeof data.settings==="object") saveSettings(data.settings);
    var classPromises = data.classes.map(function(c){
      return classesRef().add({
        name: c.name || "Importierte Klasse",
        schoolYear: c.schoolYear || "",
        subjects: c.subjects || [],
        weightTemplates: c.weightTemplates || [],
        createdAt: Date.now()
      }).then(function(ref){
        var newClassId = ref.id;
        var idMap = {};
        return Promise.all((c.students||[]).map(function(s){
          return studentsRef(newClassId).add({ name: s.name, createdAt: Date.now() }).then(function(sref){
            idMap[s.id] = sref.id;
          });
        })).then(function(){
          var gradeWrites = (c.grades||[]).map(function(g){
            var newSid = idMap[g.studentId];
            if(!newSid) return Promise.resolve();
            return gradesRef(newClassId).add({
              studentId: newSid, studentName: g.studentName || "", subject: g.subject, type: g.type,
              date: g.date, note: g.note || "", value: g.value===undefined ? null : g.value,
              detail: g.detail || "", createdAt: g.createdAt || Date.now()
            });
          });
          var finalGradeWrites = Object.keys(c.finalGrades||{}).map(function(oldSid){
            var newSid = idMap[oldSid];
            if(!newSid) return Promise.resolve();
            return finalGradesRef(newClassId).doc(newSid).set(c.finalGrades[oldSid]||{});
          });
          return Promise.all(gradeWrites.concat(finalGradeWrites));
        });
      });
    });
    Promise.all(classPromises).then(function(){
      showNotice("Import abgeschlossen: "+data.classes.length+" Klasse(n) wurden neu angelegt.");
    }).catch(function(err){
      showGlobalError("Import fehlgeschlagen — " + (err && (err.message||err.code) ? (err.message||err.code) : err));
    });
  }

  function doExportOverview(){
    var sel = document.getElementById("exportClass").value;
    allBundles(sel).then(function(bundles){
      var rows = [["Klasse","Schuljahr","Schüler:in"].concat(classSubjectsForBundles(bundles)).concat(["Gesamtschnitt"])];
      // rebuild per-bundle since subjects differ per class
      var allRows = [["Klasse","Schuljahr","Schüler:in","Fach","Notenschnitt","Anzahl Einträge"]];
      bundles.forEach(function(b){
        if(!b.cls) return;
        var subs = (b.cls.subjects||[]).map(normalizeSubjectEntry).map(function(x){ return x.name; });
        b.students.forEach(function(s){
          var sg = b.grades.filter(function(g){return g.studentId===s.id;});
          subs.forEach(function(subj){
            var items = sg.filter(function(g){return g.subject===subj;});
            var wsum=0,w=0; items.filter(hasGrade).forEach(function(g){var ww=weightFor(g.type); wsum+=g.value*ww; w+=ww;});
            allRows.push([b.cls.name, b.cls.schoolYear||"", s.name, subj, w? round1(wsum/w).toFixed(1) : "", items.length]);
          });
        });
      });
      var name = sel==="__all__" ? "alle_Klassen" : (state.classes.find(function(c){return c.id===sel;})||{}).name || "Klasse";
      triggerDownload("Notenuebersicht_"+slug(name)+".csv", toCsv(allRows));
    });
  }
  function classSubjectsForBundles(bundles){ return []; }

  function doExportRaw(){
    var sel = document.getElementById("exportClass").value;
    allBundles(sel).then(function(bundles){
      var rows = [["Klasse","Schuljahr","Schüler:in","Fach","Leistungsart","Eingabe","Datum","Note","Notenbezeichnung","Notiz"]];
      bundles.forEach(function(b){

        b.grades.slice().sort(function(a,c){return (a.date||"").localeCompare(c.date||"");}).forEach(function(g){

        });

      triggerDownload("Notendaten_"+slug(name)+".csv", toCsv(rows));

  function slug(s){ return String(s).normalize("NFKD").replace(/[^\w]+/g,"_").replace(/^_+|_+$/g,""); }
  function doExportPunktekatalog(){
    var keys = Object.keys(PUNKTE_TABLE).map(Number).sort(function(a,b){ return a-b; });

  function triggerDownload(filename, csvText){
    if(!state.downloads){ showNotice("Download in dieser Ansicht nicht verfügbar."); return; }

  // Baut die "Alle Zeugnisnoten"-Tabelle (genau die Werte, die dort auch angezeigt werden) als
  // eigenständiges PDF und bietet es zum Speichern an. Ein Klick auf einen normalen Link/
  // window.print() funktioniert innerhalb des Artefakt-Sandboxes nicht zuverlässig – deshalb
  // wird das PDF clientseitig mit jsPDF erzeugt und über die downloads-Fähigkeit angeboten.
  var GRADE_RGB = {1:[12,163,12], 2:[111,174,47], 3:[217,154,18], 4:[236,131,90], 5:[208,59,59]};
  var GRADE_TEXT_RGB = {1:[255,255,255], 2:[255,255,255], 3:[42,32,5], 4:[255,255,255], 5:[255,255,255]};
  function exportAlleZeugnisnotenPdf(){
    if(!window.jspdf || !window.jspdf.jsPDF){
      showNotice("Die PDF-Erstellung konnte nicht geladen werden. Bitte die Seite neu laden und erneut versuchen.");
      return;
    }
    var c = activeClass();
    if(!c || !state.students.length) return;
    var subs = classSubjects().map(function(s){ return s.name; });
    if(!subs.length) return;

    var doc = new window.jspdf.jsPDF({ orientation: subs.length>6 ? "landscape" : "portrait", unit:"mm", format:"a4" });
    var marginX = 14;
    var pageWidth = doc.internal.pageSize.getWidth();
    var pageHeight = doc.internal.pageSize.getHeight();
    var usableWidth = pageWidth - marginX*2;
    var nameColWidth = Math.min(50, usableWidth*0.28);
    var subColWidth = (usableWidth - nameColWidth) / subs.length;
    var rowHeight = 9;
    var y = 18;

    doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(43,35,24);
    doc.text("Alle Zeugnisnoten – "+c.name, marginX, y);
    y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(110,97,82);
    doc.text("Schuljahr "+(c.schoolYear||"–")+" · erstellt am "+fmtDate(todayISO()), marginX, y);
    y += 8;

    function drawHeaderRow(yy){
      doc.setFillColor(243,235,217);
      doc.rect(marginX, yy, usableWidth, rowHeight, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(43,35,24);
      doc.text("Schüler:in", marginX+2, yy+rowHeight/2+1.3);
      subs.forEach(function(s, i){
        var cx = marginX + nameColWidth + i*subColWidth + subColWidth/2;
        doc.text(s, cx, yy+rowHeight/2+1.3, {align:"center", maxWidth: subColWidth-2});
      });
      return yy+rowHeight;
    }

    y = drawHeaderRow(y);
    state.students.forEach(function(s, idx){
      if(y + rowHeight > pageHeight - 14){
        doc.addPage();
        y = 18;
        y = drawHeaderRow(y);
      }
      if(idx % 2 === 1){ doc.setFillColor(251,248,241); doc.rect(marginX, y, usableWidth, rowHeight, "F"); }
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(43,35,24);
      doc.text(s.name, marginX+2, y+rowHeight/2+1.3, {maxWidth: nameColWidth-4});
      subs.forEach(function(subj, i){
        var cx = marginX + nameColWidth + i*subColWidth + subColWidth/2;
        var finalVal = (state.finalGrades[s.id]||{})[subj];
        if(finalVal!=null && GRADE_RGB[finalVal]){
          var badgeW = 8, badgeH = 6;
          doc.setFillColor.apply(doc, GRADE_RGB[finalVal]);
          doc.roundedRect(cx-badgeW/2, y+(rowHeight-badgeH)/2, badgeW, badgeH, 1.4, 1.4, "F");
          doc.setFont("helvetica","bold"); doc.setTextColor.apply(doc, GRADE_TEXT_RGB[finalVal]);
          doc.text(String(finalVal), cx, y+rowHeight/2+1.3, {align:"center"});
        } else {
          doc.setFont("helvetica","normal"); doc.setTextColor(156,143,121);
          doc.text("–", cx, y+rowHeight/2+1.3, {align:"center"});
        }
      });
      y += rowHeight;
    });

    if(!state.downloads){ showNotice("PDF-Export in dieser Ansicht nicht verfügbar."); return; }
    var blob = doc.output("blob");
    state.downloads.save({filename:"Alle_Zeugnisnoten_"+slug(c.name)+".pdf", data:blob}).catch(function(e){
      if(e && e.code==="declined") return;
      showNotice("PDF-Export fehlgeschlagen: "+(e&&e.message?e.message:"unbekannter Fehler"));
    });
  }

  // Verdrahtet das einzeilige Kombifeld "Name der Leistung": zeigt/filtert die Liste
  // bereits verwendeter Namen bei Fokus/Eingabe und ruft beim Klick auf einen Vorschlag
  // onPick(name) auf (das Freitext-Tippen läuft weiterhin über die separat gesetzten
  // oninput/onchange-Handler des jeweiligen Inputs).
  function wireNoteAutocomplete(inputId, listId, onPick){
    var input = document.getElementById(inputId);
    var list = document.getElementById(listId);
    if(!input || !list) return;
    var items = Array.prototype.slice.call(list.querySelectorAll(".ac-item"));
    function filterAndToggle(){
      var q = input.value.trim().toLowerCase();
      var any = false;
      items.forEach(function(el){
        var match = !q || el.dataset.name.toLowerCase().indexOf(q) !== -1;
        el.style.display = match ? "" : "none";
        if(match) any = true;
      });
      list.hidden = !any;
    }
    input.addEventListener("focus", filterAndToggle);
    input.addEventListener("input", filterAndToggle);
    input.addEventListener("blur", function(){ setTimeout(function(){ list.hidden = true; }, 150); });
    items.forEach(function(el){
      el.onmousedown = function(e){ e.preventDefault(); }; // verhindert blur, bevor der Klick ankommt
      el.onclick = function(){
        input.value = el.dataset.name;
        list.hidden = true;
        onPick(el.dataset.name);
      };
    });
  }

          el.style.backgroundColor = ""; el.style.color = ""; el.style.borderColor = "";
          setFinalGrade(state.activeClassId, el.dataset.student, el.dataset.subject, null);
          return;

        var n = Number(raw);
        // Nur ganze Noten 1–5 sind gültig – alles andere wird abgelehnt und nicht übernommen.
        if(!Number.isInteger(n) || n<1 || n>5){
          showNotice("Ungültige Note: „"+raw+"“. Bitte eine ganze Note von 1 bis 5 eingeben.");

    if(btn) btn.setAttribute("aria-expanded", "false");
  }
  // Einmalig (nicht in afterRender, da sonst bei jedem render() ein weiterer Listener
  // hinzukäme statt den bestehenden zu ersetzen) registrierte Listener, die das geöffnete
  // mobile Menü bei einem Klick außerhalb bzw. mit Escape wieder schließen.
  document.addEventListener("click", function(e){
    var sidebar = document.querySelector(".sidebar");
    if(sidebar && sidebar.classList.contains("menu-open") && !sidebar.contains(e.target)) closeMobileMenu();
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape") closeMobileMenu();
  });

  /* ============================= Login ============================= */
  // Echte Anmeldung über Firebase Authentication statt eines im Quelltext sichtbaren
  // Passworts: der eingegebene Benutzername wird in eine feste, interne E-Mail-Adresse
  // umgewandelt (Firebase Authentication verlangt eine E-Mail-Adresse), Firebase prüft das
  // Passwort serverseitig. Das Benutzerkonto (Benutzername → E-Mail + Passwort) wird einmalig
  // in der Firebase-Konsole angelegt (siehe Einrichtungsanleitung) — es steht nirgends im
  // Quelltext dieser Seite. Firebase merkt sich die Anmeldung selbst browserübergreifend
  // (Standard: bis zum expliziten "Abmelden"), ein eigener localStorage-Mechanismus ist
  // dafür nicht mehr nötig.
  function usernameToEmail(u){
    return String(u||"").trim().toLowerCase()+"@leistungskompass.local";
  }
  // Leitet aus der internen E-Mail-Adresse des angemeldeten Firebase-Kontos wieder den
  // "Benutzernamen" ab (Teil vor dem @) — das ist der Schlüssel, mit dem dbScopePrefix()
  // weiter oben die Daten der Benutzer voneinander trennt.
  function usernameFromFirebaseUser(user){
    var email = (user && user.email) || "";
    return email.split("@")[0].toLowerCase();
  }
  var USER_DISPLAY_NAMES = { "anna": "Anna", "testuser": "Testuser" };
  function showApp(user){
    state.currentUser = usernameFromFirebaseUser(user);
    var overlay = document.getElementById("loginOverlay");
    var app = document.getElementById("app");
    if(overlay) overlay.hidden = true;
    if(app) app.hidden = false;
    var brandSub = document.getElementById("brandSubLabel");
    if(brandSub) brandSub.textContent = "Volksschule || " + (USER_DISPLAY_NAMES[state.currentUser] || state.currentUser);
    boot();
  }
  function showLogin(){
    var overlay = document.getElementById("loginOverlay");
    var app = document.getElementById("app");
    if(app) app.hidden = true;
    if(overlay) overlay.hidden = false;
    var pass = document.getElementById("loginPass"); if(pass) pass.value = "";
    var btn = document.getElementById("loginSubmitBtn");
    if(btn){ btn.disabled = false; btn.textContent = "Anmelden"; }
  }

  if(!FIREBASE_READY){
    // firebaseConfig oben im Quelltext wurde noch nicht durch die Werte des eigenen
    // Firebase-Projekts ersetzt — ohne gültige Konfiguration kann sich niemand anmelden.
    var overlayEl = document.getElementById("loginOverlay");
    if(overlayEl) overlayEl.innerHTML = '<div class="card card-pad" style="max-width:420px;">'
      + '<div class="section-title">Einrichtung nötig</div>'
      + '<p style="font-size:0.9rem; line-height:1.5; margin:0;">Diese Datei ist noch nicht mit einem eigenen Firebase-Projekt verbunden. Bitte <code>firebaseConfig</code> im Quelltext (ganz oben im ersten eigenen &lt;script&gt;-Bereich) durch die Werte deines Firebase-Projekts ersetzen — siehe Einrichtungsanleitung.</p>'
      + '</div>';
  } else {
    var loginForm = document.getElementById("loginForm");
    if(loginForm) loginForm.onsubmit = function(e){
      e.preventDefault();
      var u = document.getElementById("loginUser").value;
      var p = document.getElementById("loginPass").value;
      var err = document.getElementById("loginError");
      var btn = document.getElementById("loginSubmitBtn");
      if(err) err.hidden = true;
      if(btn){ btn.disabled = true; btn.textContent = "Anmelden…"; }
      firebase.auth().signInWithEmailAndPassword(usernameToEmail(u), p).catch(function(error){
        if(err){ err.hidden = false; }
        document.getElementById("loginPass").value = "";
        if(btn){ btn.disabled = false; btn.textContent = "Anmelden"; }
      });
    };
    var logoutBtn = document.getElementById("logoutBtn");
    if(logoutBtn) logoutBtn.onclick = function(){ firebase.auth().signOut(); };

    // onAuthStateChanged feuert einmal beim Laden (mit dem evtl. noch bestehenden
    // Anmeldestatus aus einer vorherigen Sitzung) und danach bei jeder An-/Abmeldung.
    firebase.auth().onAuthStateChanged(function(user){
      if(user) showApp(user); else showLogin();
    });
  }
})();
</script>
</body>
</html>
